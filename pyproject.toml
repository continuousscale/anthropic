[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csfiler"
version = "0.1.0"
description = "AI file renaming and filing agent for Continuous Scale LLC, operating on Google Drive."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "python-dateutil>=2.8",
  "google-api-python-client>=2",
  "google-auth>=2",
  "google-auth-oauthlib>=1",
  "pypdf>=4",
  "python-docx>=1",
  "openpyxl>=3",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
csfiler = "csfiler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
